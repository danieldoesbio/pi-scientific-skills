name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep this node version in sync with "engines.node" in package.json.
          - pi: "0.87.0"
            node: "22.18.0"
          # pi 1.0 needs Node 22.19 or later.
          - pi: "1.0.0"
            node: "22.19.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install pi
        run: npm install -g @earendil-works/pi-coding-agent@${{ matrix.pi }}

      - name: Locate pi's dist, pin PI_DIST
        run: |
          PI_DIST="$(npm root -g)/@earendil-works/pi-coding-agent/dist"
          if [ ! -f "$PI_DIST/core/agent-session.js" ]; then
            echo "::error::pi's dist layout changed — expected $PI_DIST/core/agent-session.js"
            exit 1
          fi
          echo "PI_DIST=$PI_DIST" >> "$GITHUB_ENV"

      # No `npm ci`/`npm install` for this repo: no dependencies, no lockfile —
      # every module comes from the globally installed pi above.
      - run: npm test

      - run: npm run typecheck
